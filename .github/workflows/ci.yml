name: CI

# The pull-request stage, unchanged, and still the merge condition. A push to
# main runs the main stage (main.yml, no -race, posts ci-ok) and then the
# deploy stage (deploy.yml, race, macOS, release artifacts, install smoke);
# operator decision 2026-11-07,
# hk:doc decision/2026-11-07/fleet-ci-three-tiers-r2 §1, §4-2.
#
# workflow_dispatch runs one stage on any ref. This file already exists on the
# default branch, so it can be dispatched from a branch; main.yml and
# deploy.yml cannot (GitHub requires the file on the default branch for
# workflow_dispatch), so this is the manual ref path -- the equivalent of
# ci-any-ref.yml suite=deploy where a repository has one. It runs one stage and
# nothing else, so its duration is that stage's.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Stage to run on this ref'
        required: true
        type: choice
        options:
          - main
          - deploy
permissions:
  contents: read
jobs:
  vet:
    if: ${{ github.event_name == 'pull_request' }}
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
  test:
    if: ${{ github.event_name == 'pull_request' }}
    name: test (haproxy + docker)
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping when a dependency is missing.
      SHIFTGATE_REQUIRE_HAPROXY: '1'
      SHIFTGATE_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install HAProxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq haproxy
          sudo systemctl stop haproxy || true
          haproxy -v
      - run: docker version --format '{{.Server.Version}}'
      - run: go test -race -v ./...
  build:
    if: ${{ github.event_name == 'pull_request' }}
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go build -trimpath -ldflags='-s -w' -o dist/shiftgate-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/shiftgate
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  main-stage:
    # The manual ref path for the main stage. A local reusable workflow is read
    # from this commit, so it runs on a branch even before it is on main.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'main' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/main.yml

  deploy-stage:
    # The manual ref path for the deploy stage (r2 §4-2): the same stage, on
    # the dispatched ref's sha, posting deploy-ok there.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'deploy' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
