# Push-only CI (example — not wired to any repository).
#
# Pull-based deploys: CI only builds and pushes the image. The host runs
# `shiftgate follow <svc> --tag main` on a schedule (see README, "Pull-based
# deploys") and deploys the new digest itself. CI holds no SSH key, no
# tailnet credential and nothing else that can reach the host; its only
# credential is GITHUB_TOKEN with packages: write.
name: build and push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cross-build for an ARM host on an x86 runner (or use an ARM runner).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build for the host's architecture (an ARM host here); add
          # linux/amd64 for a multi-arch index. follow resolves the tag to
          # the same digest `docker pull` uses either way.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "pushed ${DIGEST}; the host's follow job deploys it within its schedule" >> "$GITHUB_STEP_SUMMARY"
